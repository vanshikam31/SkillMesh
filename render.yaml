# Render: deploys the backend (FastAPI) as a free web service.
# The database is NOT created here: Render's free PostgreSQL expires after 30 days. Use Neon (free) and paste its
# connection string into DATABASE_URL. The frontend goes on Vercel (see README).
services:
  - type: web
    name: skillmesh-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-FRONTEND.vercel.app
      - key: FRONTEND_URL
        value: https://YOUR-FRONTEND.vercel.app
      - key: SHOW_RESET_LINK
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.3
