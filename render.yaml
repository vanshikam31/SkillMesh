# Render Blueprint: deploys the backend (FastAPI) and a PostgreSQL database.  Frontend goes on Vercel (see README).
databases:
  - name: skillmesh-db
    plan: free
services:
  - type: web
    name: skillmesh-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: skillmesh-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-FRONTEND.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.3
