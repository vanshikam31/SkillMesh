[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmesh-ml"
version = "0.1.0"
description = "SkillMesh AI/ML engine: skill similarity, compatibility scoring and peer recommendation"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["skillmesh_ml*"]
